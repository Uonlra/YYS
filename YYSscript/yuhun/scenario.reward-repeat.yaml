name: reward_repeat
max_clicks: auto
max_retries: 1
retry_after_clicks: false
repeat_count: null
max_cycles: 800
recovery_scans: 2
recovery_interval_seconds: 1.0
stable_frames: 3

steps:
  - id: start
    max_attempts: 3
    next_step: confirm
    response_timeout_seconds: 3
    recover_to: [confirm, reward]
    type: match_and_click
    image: ../../assets/targets/start.png
    threshold: 0.86
    timeout_seconds: 30
    wait_after_seconds: 10.0
    scan_interval_seconds: 0.5

  - id: confirm
    max_attempts: 3
    next_step: reward
    response_timeout_seconds: 3
    recover_to: [reward]
    type: match_and_click
    image: ../../assets/targets/confirm.png
    threshold: 0.86
    timeout_seconds: 180
    wait_after_seconds: 1.0
    scan_interval_seconds: 0.2

  - id: reward
    max_attempts: 3
    next_step: returned_to_start
    response_timeout_seconds: 3
    recover_to: [returned_to_start]
    type: match_and_click
    image: ../../assets/targets/reward.png
    threshold: 0.86
    timeout_seconds: 60
    wait_after_seconds: 1.0
    scan_interval_seconds: 0.15

  - id: returned_to_start
    requires_action: reward
    type: wait_for_image
    image: ../../assets/targets/start.png
    threshold: 0.86
    timeout_seconds: 60
    wait_after_seconds: 0
    scan_interval_seconds: 0.2
