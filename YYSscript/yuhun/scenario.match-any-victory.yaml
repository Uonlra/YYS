name: yuhun_match_any_victory
max_retries: 1
retry_after_clicks: false
steps:
- id: start
  type: match_and_click
  timeout_seconds: 30.0
  wait_after_seconds: 1.0
  max_attempts: 1
  response_timeout_seconds: 3.0
  recover_to: []
  scan_interval_seconds: 0.1
  image: ../../assets/targets/start.png
  threshold: 0.75
- id: victory
  type: match_and_click
  timeout_seconds: 30.0
  wait_after_seconds: 1.0
  max_attempts: 1
  response_timeout_seconds: 3.0
  recover_to: []
  scan_interval_seconds: 0.1
  image: ../../assets/targets/victory.png
  threshold: 0.75
- id: reward
  type: match_and_click
  timeout_seconds: 30.0
  wait_after_seconds: 1.0
  max_attempts: 1
  response_timeout_seconds: 3.0
  recover_to: []
  scan_interval_seconds: 0.1
  image: ../../assets/targets/reward.png
  threshold: 0.75
- id: continue
  type: match_and_click
  timeout_seconds: 30.0
  wait_after_seconds: 0.5
  max_attempts: 1
  response_timeout_seconds: 3.0
  recover_to: []
  image: ../../assets/targets/continue.png
  threshold: 0.75
repeat_count: 1
max_cycles: 800
max_clicks: 2400
recovery_scans: 0
recovery_interval_seconds: 1.0
stable_frames: 2
execution_mode: match_any
input_backend: window_message
no_target_timeout_seconds: 300.0
match_any_click_interval_seconds: 1.0
stop_when: []
match_any_detection_mode: coarse_to_fine
