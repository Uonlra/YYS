name: yuhun_match_any
execution_mode: match_any
input_backend: window_message
# Require two consecutive frames with the same visible target set before clicking.
stable_frames: 2
max_clicks: 2400
no_target_timeout_seconds: 60
match_any_click_interval_seconds: 1.0

steps:
  - id: start
    type: match_and_click
    image: ../../assets/targets/start.png
    threshold: 0.86
    wait_after_seconds: 1.0

  - id: confirm
    type: match_and_click
    image: ../../assets/targets/confirm.png
    threshold: 0.86
    wait_after_seconds: 1.0

  - id: reward
    type: match_and_click
    image: ../../assets/targets/reward.png
    threshold: 0.86
    wait_after_seconds: 1.0
