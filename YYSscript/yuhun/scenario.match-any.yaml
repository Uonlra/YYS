name: yuhun_match_any
execution_mode: match_any
# Half-resolution candidates are verified with original-resolution color matching.
# Set exhaustive to restore the original full-frame search.
match_any_detection_mode: coarse_to_fine
input_backend: window_message
# Require two consecutive frames with the same visible target set before clicking.
stable_frames: 2
max_clicks: 2400
no_target_timeout_seconds: 60
match_any_click_interval_seconds: 1.0

# Tolerate some animation/background variation; retain two-frame confirmation.
steps:
  - id: start
    type: match_and_click
    image: ../../assets/targets/start.png
    threshold: 0.75
    wait_after_seconds: 1.0
    scan_interval_seconds: 0.1

  - id: confirm
    type: match_and_click
    image: ../../assets/targets/confirm.png
    threshold: 0.75
    wait_after_seconds: 1.0
    scan_interval_seconds: 0.1

  - id: reward
    type: match_and_click
    image: ../../assets/targets/reward.png
    threshold: 0.75
    wait_after_seconds: 1.0
    scan_interval_seconds: 0.1

  - id: continue
    type: match_and_click
    image: ../../assets/targets/continue.png
    threshold: 0.75
    wait_after_seconds: 1.0
    scan_interval_seconds: 0.1
