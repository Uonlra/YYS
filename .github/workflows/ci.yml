name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q run.py src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate shipped scenarios
        shell: pwsh
        run: |
          python run.py --config config.example.yaml --validate-scenario YYSscript/yuhun/scenario.match-any.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python run.py --config config.example.yaml --validate-scenario YYSscript/yuhun/scenario.reward-once.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python run.py --config config.example.yaml --validate-scenario YYSscript/yuhun/scenario.reward-repeat.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
