[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yys-automation"
version = "0.1.0"
description = "Local Windows desktop UI automation helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.1",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
